# CI/CD: every PR and push is checked; pushes to main then migrate the database and deploy to
# Vercel production, in that order, so the app never goes live ahead of the schema it needs.
# PR preview deployments are still created by Vercel's Git integration.
name: Pipeline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  # Never cancel a running production deploy halfway through migrations.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Runtime config is validated at server start, not at build time, so no secrets are needed here.
      - run: npm run build

  migrate:
    name: Apply database migrations
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      # Applies only migrations not yet recorded in the remote history; a no-op otherwise.
      - run: supabase db push --include-all

  deploy:
    name: Deploy to Vercel production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Pulls the production env vars configured in the Vercel dashboard, then builds and ships the exact artifact.
      - run: npx vercel@65 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: npx vercel@65 build --prod --token="$VERCEL_TOKEN"
      - id: ship
        run: echo "url=$(npx vercel@65 deploy --prebuilt --prod --token="$VERCEL_TOKEN")" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        # Uses the public production domain: per-deployment URLs sit behind Vercel Deployment Protection.
        env:
          BASE_URL: ${{ vars.PRODUCTION_URL || steps.ship.outputs.url }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "$BASE_URL/api/v1/health"
