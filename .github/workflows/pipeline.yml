# CI: every PR and push is checked. Deployments are done by Vercel's Git integration
# (every push to main goes to production, PRs get previews).
# On main, pending database migrations are applied once the Supabase secrets are configured.
name: Pipeline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  # Never cancel a running production deploy halfway through migrations.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Runtime config is validated at server start, not at build time, so no secrets are needed here.
      - run: npm run build

  migrate:
    name: Apply database migrations
    # Skipped until SUPABASE_PROJECT_ID (and the two secrets) are set in the production environment.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SUPABASE_PROJECT_ID != ''
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      # Applies only migrations not yet recorded in the remote history; a no-op otherwise.
      - run: supabase db push --include-all
